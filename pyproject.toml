[project]
name = "agent-knowledge-repo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["api", "worker"]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
domain = { workspace = true }
application = { workspace = true }
model-gateway = { workspace = true }
infrastructure = { workspace = true }
api = { workspace = true }
worker = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["cases", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["^cases/", "^.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["cases", ".venv"]
markers = [
    "integration: requires explicitly configured local PostgreSQL and Redis services",
]

[tool.coverage.run]
source = ["apps", "packages"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"errors.py" = ["ARG001"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "alembic",
    "ruff>=0.9",
    "mypy>=1.14",
]
