[project]
name = "agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "domain",
    "jsonschema>=4.23,<5",
    "model-gateway",
    "packaging>=24,<27",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_runtime*"]
