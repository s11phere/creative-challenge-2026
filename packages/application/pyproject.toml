[project]
name = "application"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["domain", "jsonschema>=4.23,<5", "model-gateway"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["application*"]
