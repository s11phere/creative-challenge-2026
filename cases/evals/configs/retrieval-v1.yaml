schema_version: retrieval-eval-config-v1
status: provisional
corpus:
  version: v0
  manifest_path: cases/evals/corpus/v0/manifest.yaml
  manifest_sha256: 53d6f863060dd7d5e6affb0abda64348f0b498995b3d1cda5ef80f0e576ca738
  required_allowed_use: local_evaluation
dataset:
  version: v0
  cases_path: cases/evals/datasets/knowledge-qa-v0/cases.jsonl
  cases_sha256: 19b58c1471ff69b748233c61470cb19ce38c74d0bf6b83c4555cde18d7456fda
  schema_path: cases/evals/datasets/knowledge-qa-v0/schema.json
  schema_sha256: 4949f3f4a9212f5fa02c915850f06a64bde501df0568e57fab582057a3b45e16
  splits:
    development:
      count: 127
      content_sha256: 6e870ee94cb64367d111557a2d1fdfc0d3f8b231e2d60cde7e7118e3881e239c
    holdout:
      count: 149
      content_sha256: ec56aa778587f0b66b78a2aa2d55dad04e187930f1b75423bb42b5d31a077b28
protocol:
  evidence_match: source_key+source_version+locator_overlap-v1
  included_source_formats:
    - markdown
    - text
    - pdf
  metrics:
    - evidence_recall
    - mrr
    - evidence_ndcg
    - full_evidence_coverage
    - must_exclude_violations
    - latency_p50_p95
    - failure_rate
  recall_k: 5
  ndcg_k: 5
  no_evidence_policy: exclude_from_recall_and_ranking_denominators
  safety_slices:
    - no_answer
    - cross_space
    - withdrawn_version
    - adversarial_document
runtime:
  target: Windows 10.0.26200; Intel64 family 6 model 183; 32 logical processors
  concurrency: 1
  warmup_queries: 3
  sampling: one_complete_pass
  retrieval_p95_budget_ms: 1000
experiments:
  - id: keyword-baseline
    mode: keyword
    dense_mode: exact
    profile: &baseline_profile
      keyword_candidate_k: 30
      dense_candidate_k: 30
      fusion_candidate_k: 30
      rrf_k: 60
      fusion_alpha: 0.5
      reranker_enabled: false
      rerank_k: 10
      final_k: 5
      adjacent_window: 1
      max_chunks_per_document: 3
      hybrid_embedding_failure_policy: error
      reranker_failure_policy: error
  - id: dense-exact
    mode: dense
    dense_mode: exact
    profile: *baseline_profile
  - id: dense-ivfflat
    mode: dense
    dense_mode: ivfflat
    ivfflat_probes: 10
    profile: *baseline_profile
  - id: hybrid
    mode: hybrid
    dense_mode: exact
    profile: *baseline_profile

  # ── candidate pool expansion (dense only) ────────────────────
  - id: dense-exact-k100
    mode: dense
    dense_mode: exact
    profile:
      <<: *baseline_profile
      dense_candidate_k: 100
gates:
  formal_manifest_status: frozen
  stage_2_step_9_acceptance_path: docs/stage-2-acceptance.md
  formal_runs_enabled: false
