manifest_version: "2"
name: create_review_cards
version: 1.0.0
description: Preview citation-backed review cards without performing unavailable derived writes.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools: []
required_capabilities: [fast_chat]
permissions: [read_knowledge, model]
budgets: {max_steps: 4, max_tool_calls: 1, max_input_tokens: 8192, max_output_tokens: 4096, timeout_seconds: 60}
entrypoint: workflow.yaml
compatibility: {runtime: ">=0.1.0,<1.0.0", checkpoint_schema_versions: [2]}
prompts: [prompts/boundary.md]
evals: [evals/cases.jsonl]
invocation:
  command: cards
  aliases: [flashcards]
  argument_hint: "<主题或文档>"
  trigger:
    summary: "根据当前 Space 的证据生成复习卡预览，写入仍需审批"
    when:
      - "用户明确要求根据知识库资料制作复习卡"
    avoid_when:
      - "用户没有要求知识库支撑的复习材料"
    examples:
      - "为量子力学常用公式制作复习卡"
  input_mode: document
