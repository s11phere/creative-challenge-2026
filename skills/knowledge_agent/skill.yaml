manifest_version: "1"
name: knowledge_agent
version: 0.1.0
description: Bounded LLM Agent routing one question through the grounded QA Tool.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools:
  - name: grounded_qa
    version: 1.0.0
required_capabilities:
  - fast_chat
permissions:
  - read_knowledge
  - model
budgets:
  max_steps: 4
  max_tool_calls: 1
  max_input_tokens: 8192
  max_output_tokens: 2048
  timeout_seconds: 90
entrypoint: workflow.yaml
compatibility:
  runtime: ">=0.1.0,<1.0.0"
  checkpoint_schema_versions: [1]
prompts:
  - prompts/system.md
evals:
  - evals/cases.jsonl
