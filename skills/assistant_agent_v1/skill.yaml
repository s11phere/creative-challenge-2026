manifest_version: "1"
name: assistant_agent
version: 0.1.0
description: Internal product-level autonomous Assistant Tool loop.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools:
  - name: knowledge_search
    version: 1.1.0
  - name: knowledge_inspect
    version: 1.1.0
  - name: grounded_answer
    version: 1.1.0
  - name: verify_answer
    version: 1.1.0
  - name: finalize_answer
    version: 1.1.0
required_capabilities:
  - fast_chat
permissions:
  - read_knowledge
  - model
budgets:
  max_steps: 14
  max_tool_calls: 10
  max_input_tokens: 49152
  max_output_tokens: 12288
  timeout_seconds: 300
entrypoint: workflow.yaml
compatibility:
  runtime: ">=0.1.0,<1.0.0"
  checkpoint_schema_versions: [1]
prompts:
  - prompts/system.md
evals:
  - evals/cases.jsonl
