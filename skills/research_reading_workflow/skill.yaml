manifest_version: "2"
name: research_reading_workflow
version: 2.0.0
description: Native research agent for one-paper deep reading or a question-driven review of two to eight confirmed papers.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools:
  - {name: research_discover, version: 2.0.0}
  - {name: research_prepare, version: 2.0.0}
  - {name: knowledge_retrieve, version: 1.0.0}
  - {name: knowledge_answer, version: 1.0.0}
required_capabilities: [fast_chat]
permissions: [read_knowledge, model]
budgets:
  max_steps: 16
  max_tool_calls: 12
  max_input_tokens: 65536
  max_output_tokens: 16384
  timeout_seconds: 600
entrypoint: workflow.yaml
compatibility:
  runtime: ">=0.1.0,<1.0.0"
  checkpoint_schema_versions: [2]
prompts: [prompts/boundary.md]
evals: [evals/cases.jsonl]
invocation:
  command: research
  aliases: [literature]
  argument_hint: "<论文名称或研究主题>"
  trigger:
    summary: "精读一篇论文，或对当前 Space 中 2–8 篇论文生成带引用的证据矩阵和主题综述"
    when:
      - "用户希望精读一篇论文并理解方法、公式、实验和局限"
      - "用户希望综合多篇论文，区分共识、条件差异、冲突和资料空白"
    avoid_when:
      - "用户只询问单个事实或总结普通非论文文档"
      - "用户要求执行复现实验、代码或生成无证据的研究结论"
    examples:
      - "精读 Transformer 论文，并用本科生能理解的方式解释核心方法"
      - "综合这四篇图神经网络论文，给出证据矩阵和主题综述"
  input_mode: question
  execution_mode: native_tool_use
