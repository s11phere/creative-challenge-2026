manifest_version: "2"
name: compare_sources
version: 1.0.0
description: Compare at least two Space-owned published sources with verified citations.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools: []
required_capabilities: [fast_chat]
permissions: [read_knowledge, model]
budgets: {max_steps: 4, max_tool_calls: 1, max_input_tokens: 8192, max_output_tokens: 4096, timeout_seconds: 60}
entrypoint: workflow.yaml
compatibility: {runtime: ">=0.1.0,<1.0.0", checkpoint_schema_versions: [1]}
prompts: [prompts/boundary.md]
evals: [evals/cases.jsonl]
invocation:
  command: compare
  aliases: [contrast]
  argument_hint: "<比较问题>"
  trigger:
    summary: "比较当前 Space 中至少两个已发布来源的内容并保留引用"
    when:
      - "用户明确要求比较两个或多个库内来源"
    avoid_when:
      - "用户只需要一般性概念比较且未涉及知识库内容"
    examples:
      - "比较课程笔记和数学笔记中的优化方法"
  input_mode: question
