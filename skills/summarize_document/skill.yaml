manifest_version: "2"
name: summarize_document
version: 1.0.0
description: Summarize one fixed published document version with grounded citations.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools: []
required_capabilities: [fast_chat]
permissions: [read_knowledge, model]
budgets:
  max_steps: 4
  max_tool_calls: 1
  max_input_tokens: 8192
  max_output_tokens: 4096
  timeout_seconds: 60
entrypoint: workflow.yaml
compatibility:
  runtime: ">=0.1.0,<1.0.0"
  checkpoint_schema_versions: [1]
prompts: [prompts/boundary.md]
evals: [evals/cases.jsonl]
invocation:
  command: summarize
  aliases: [summary]
  argument_hint: "<文档或主题> [重点]"
  trigger:
    summary: "对当前 Space 中的一个已发布文档生成带引用摘要"
    when:
      - "用户明确要求总结、提炼或概览某个库内文档"
    avoid_when:
      - "用户只是要求总结刚刚输入的一小段文字"
    examples:
      - "总结操作系统笔记中的内存章节"
  input_mode: document
