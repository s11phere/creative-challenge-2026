manifest_version: "2"
name: knowledge_qa
version: 0.2.0
description: Provisional contract package delegating to the Grounded QA Application port.
input_schema: schemas/input.json
output_schema: schemas/output.json
required_tools: []
required_capabilities:
  - fast_chat
permissions:
  - read_knowledge
  - model
budgets:
  max_steps: 4
  max_tool_calls: 1
  max_input_tokens: 8192
  max_output_tokens: 4096
  timeout_seconds: 60
entrypoint: workflow.yaml
compatibility:
  runtime: ">=0.1.0,<1.0.0"
  checkpoint_schema_versions: [1]
prompts:
  - prompts/boundary.md
evals:
  - evals/cases.jsonl
invocation:
  command: ask
  aliases: [qa]
  argument_hint: "<问题>"
  trigger:
    summary: "从当前 Space 的知识库检索证据并回答问题"
    when:
      - "用户明确询问当前知识库、笔记或已上传资料中的事实或解释"
    avoid_when:
      - "用户只是在进行日常聊天或请求一般性帮助"
    examples:
      - "我的笔记里进程和线程有什么区别"
  input_mode: question
