workflow_version: "1"
start: plan
nodes:
  - id: plan
    step: planning
    handler: knowledge_agent_plan
    next: retrieve
    max_retries: 0
    required_permissions: []
    reserve:
      tool_calls: 0
      input_tokens: 0
      output_tokens: 0
  - id: retrieve
    step: retrieving
    handler: knowledge_agent_plan
    next: execute
    max_retries: 0
    required_permissions: []
    reserve:
      tool_calls: 0
      input_tokens: 0
      output_tokens: 0
  - id: execute
    step: executing
    handler: knowledge_agent_execute
    next: verify
    max_retries: 0
    required_permissions:
      - read_knowledge
      - model
    reserve:
      tool_calls: 1
      input_tokens: 8192
      output_tokens: 2048
  - id: verify
    step: verifying
    handler: knowledge_agent_verify
    next: null
    max_retries: 0
    required_permissions: []
    reserve:
      tool_calls: 0
      input_tokens: 0
      output_tokens: 0
