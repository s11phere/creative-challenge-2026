x-api-image: &api-image
  image: agent-knowledge-api:local

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      WORKER_THREADS: ${WORKER_THREADS:-4}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      QA_TASK_TIMEOUT_MS: ${QA_TASK_TIMEOUT_MS:-300000}
      QA_TASK_MAX_RETRIES: ${QA_TASK_MAX_RETRIES:-12}
      QA_TASK_RETRY_DELAY_MS: ${QA_TASK_RETRY_DELAY_MS:-3000}
      QA_TASK_LEASE_SECONDS: ${QA_TASK_LEASE_SECONDS:-30}
      QA_TASK_HEARTBEAT_INTERVAL_S: ${QA_TASK_HEARTBEAT_INTERVAL_S:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      FAST_CHAT_ENDPOINT: ${FAST_CHAT_ENDPOINT:-}
      FAST_CHAT_API_KEY: ${FAST_CHAT_API_KEY:-}
      FAST_CHAT_MODEL: ${FAST_CHAT_MODEL:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_PROTOCOL: ${EMBEDDING_PROTOCOL:-openai-compatible}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-inherit}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-inherit}
      EMBEDDING_QUERY_INSTRUCTION_VERSION: ${EMBEDDING_QUERY_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_DOCUMENT_INSTRUCTION_VERSION: ${EMBEDDING_DOCUMENT_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_NORMALIZATION: ${EMBEDDING_NORMALIZATION:-none}
      EMBEDDING_PRECISION: ${EMBEDDING_PRECISION:-float32}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-32}
      MODEL_ALLOW_EXTERNAL: ${MODEL_ALLOW_EXTERNAL:-false}
      AGENT_WORKSPACE_MODEL_VISIBILITY_CONSENT: ${AGENT_WORKSPACE_MODEL_VISIBILITY_CONSENT:-false}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-15}
      FAST_CHAT_TIMEOUT_SECONDS: ${FAST_CHAT_TIMEOUT_SECONDS:-120}
      FAST_CHAT_REASONING_ENABLED: ${FAST_CHAT_REASONING_ENABLED:-false}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.1}
      SKILL_ROOT_PATH: ${SKILL_ROOT_PATH:-./skills}
      PERSONAL_SKILLS_DIR: /data/personal-skills
      KNOWLEDGE_AGENT_SKILL_VERSION: ${KNOWLEDGE_AGENT_SKILL_VERSION:-1.0.0}
      AGENT_WORKSPACE_ROOT_PATH: /data/agent-workspaces
      AGENT_WORKSPACE_COMMAND_ALIASES: ${AGENT_WORKSPACE_COMMAND_ALIASES:-python,git,uv,node,pnpm,npm}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)",
        ]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages

    volumes:
      - blobdata:/app/data/blobs
      - ${AGENT_WORKSPACE_HOST_PATH:-../data/workspaces}:/data/agent-workspaces
      - ${PERSONAL_SKILLS_HOST_PATH:-../data/personal_skills}:/data/personal-skills

  worker:
    image: agent-knowledge-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QA_TASK_TIMEOUT_MS: ${QA_TASK_TIMEOUT_MS:-300000}
      QA_TASK_MAX_RETRIES: ${QA_TASK_MAX_RETRIES:-12}
      QA_TASK_RETRY_DELAY_MS: ${QA_TASK_RETRY_DELAY_MS:-3000}
      QA_TASK_LEASE_SECONDS: ${QA_TASK_LEASE_SECONDS:-30}
      QA_TASK_HEARTBEAT_INTERVAL_S: ${QA_TASK_HEARTBEAT_INTERVAL_S:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      FAST_CHAT_ENDPOINT: ${FAST_CHAT_ENDPOINT:-}
      FAST_CHAT_API_KEY: ${FAST_CHAT_API_KEY:-}
      FAST_CHAT_MODEL: ${FAST_CHAT_MODEL:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_PROTOCOL: ${EMBEDDING_PROTOCOL:-openai-compatible}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-inherit}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-inherit}
      EMBEDDING_QUERY_INSTRUCTION_VERSION: ${EMBEDDING_QUERY_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_DOCUMENT_INSTRUCTION_VERSION: ${EMBEDDING_DOCUMENT_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_NORMALIZATION: ${EMBEDDING_NORMALIZATION:-none}
      EMBEDDING_PRECISION: ${EMBEDDING_PRECISION:-float32}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-32}
      MODEL_ALLOW_EXTERNAL: ${MODEL_ALLOW_EXTERNAL:-false}
      AGENT_WORKSPACE_MODEL_VISIBILITY_CONSENT: ${AGENT_WORKSPACE_MODEL_VISIBILITY_CONSENT:-false}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-15}
      FAST_CHAT_TIMEOUT_SECONDS: ${FAST_CHAT_TIMEOUT_SECONDS:-120}
      FAST_CHAT_REASONING_ENABLED: ${FAST_CHAT_REASONING_ENABLED:-false}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.1}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-15}
      RETRIEVAL_DEBUG_DIAGNOSTICS: ${RETRIEVAL_DEBUG_DIAGNOSTICS:-false}
      QA_DEBUG_TRACE_ENABLED: ${QA_DEBUG_TRACE_ENABLED:-false}
      QA_DEBUG_TRACE_PATH: /data/qa-debug
      QA_DEBUG_TRACE_MAX_BYTES: ${QA_DEBUG_TRACE_MAX_BYTES:-10000000}
      SKILL_ROOT_PATH: ${SKILL_ROOT_PATH:-./skills}
      PERSONAL_SKILLS_DIR: /data/personal-skills
      KNOWLEDGE_AGENT_SKILL_VERSION: ${KNOWLEDGE_AGENT_SKILL_VERSION:-1.0.0}
      AGENT_WORKSPACE_ROOT_PATH: /data/agent-workspaces
      AGENT_WORKSPACE_COMMAND_ALIASES: ${AGENT_WORKSPACE_COMMAND_ALIASES:-python,git,uv,node,pnpm,npm}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'worker' /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages
    volumes:
      - blobdata:/app/data/blobs
      - ${QA_DEBUG_TRACE_HOST_PATH:-../tmp/qa-debug}:/data/qa-debug
      - ${AGENT_WORKSPACE_HOST_PATH:-../data/workspaces}:/data/agent-workspaces
      - ${PERSONAL_SKILLS_HOST_PATH:-../data/personal_skills}:/data/personal-skills

  web:
    image: agent-knowledge-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: {}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  otel-collector:
    profiles:
      - otel
    image: otel/opentelemetry-collector-contrib:0.121.0@sha256:789689988e379c58ac12b07718dbcf4b23c2214bd804173c1c77af346d381c15
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  tei:
    profiles:
      - embedding
    # GPU version: requires nvidia-container-toolkit on host + CUDA 12.2+ drivers
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9@sha256:249a0bc87522bfe2f1012b4d194f0225878f47079115ada3aeb0b1ef257b402a
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --revision
      - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --max-batch-tokens
      - "512"
      - --max-client-batch-size
      - "8"
      - --max-batch-requests
      - "1"
    environment:
      RAYON_NUM_THREADS: "8"
    ports:
      - "${EMBEDDING_PORT:-8080}:80"
    volumes:
      - teidata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  tei-reranker:
    profiles:
      - reranker
    # GPU version: requires nvidia-container-toolkit on host + CUDA 12.2+ drivers
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9@sha256:249a0bc87522bfe2f1012b4d194f0225878f47079115ada3aeb0b1ef257b402a
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
    ports:
      - "${RERANKER_PORT:-8081}:80"
    volumes:
      - rerankerdata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  blobdata:
  personalskills:
  # Allow reusing a prewarmed model cache (for example after a first-download
  # interruption) without changing the service mount or model configuration.
  teidata:
    name: ${TEI_VOLUME_NAME:-deploy_teidata}
  rerankerdata:
    name: ${RERANKER_VOLUME_NAME:-deploy_rerankerdata}
