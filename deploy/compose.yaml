services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:011c0f8a1e199b6f0f96b637125b5b4971ffad0aee2bd5f4ecb6856219e0ed3b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agent_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:eff782af732aa34345ae3903510581a111ded08b9e1a59b295327a4ac8c57e2a
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-to-a-random-secret}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages

  web:
    build:
      context: ../apps/web
      dockerfile: ../../deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  otel-collector:
    profiles:
      - otel
    image: otel/opentelemetry-collector-contrib:0.121.0@sha256:611592f4e18acc8e1a1d2d9f99d80b8ea25c845e8a00913ad72469d6813d0c6f
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml

volumes:
  pgdata:
