x-api-image: &api-image
  image: agent-knowledge-api:local

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      FAST_CHAT_ENDPOINT: ${FAST_CHAT_ENDPOINT:-}
      FAST_CHAT_API_KEY: ${FAST_CHAT_API_KEY:-}
      FAST_CHAT_MODEL: ${FAST_CHAT_MODEL:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      EMBEDDING_PROTOCOL: ${EMBEDDING_PROTOCOL:-openai-compatible}
      EMBEDDING_QUERY_INSTRUCTION_VERSION: ${EMBEDDING_QUERY_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_DOCUMENT_INSTRUCTION_VERSION: ${EMBEDDING_DOCUMENT_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_NORMALIZATION: ${EMBEDDING_NORMALIZATION:-none}
      EMBEDDING_PRECISION: ${EMBEDDING_PRECISION:-float32}
      MODEL_ALLOW_EXTERNAL: ${MODEL_ALLOW_EXTERNAL:-false}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-15}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)",
        ]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages

    volumes:
      - blobdata:/app/data/blobs

  worker:
    image: agent-knowledge-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      FAST_CHAT_ENDPOINT: ${FAST_CHAT_ENDPOINT:-}
      FAST_CHAT_API_KEY: ${FAST_CHAT_API_KEY:-}
      FAST_CHAT_MODEL: ${FAST_CHAT_MODEL:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      RERANKER_ENDPOINT: ${RERANKER_ENDPOINT:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      EMBEDDING_PROTOCOL: ${EMBEDDING_PROTOCOL:-openai-compatible}
      EMBEDDING_QUERY_INSTRUCTION_VERSION: ${EMBEDDING_QUERY_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_DOCUMENT_INSTRUCTION_VERSION: ${EMBEDDING_DOCUMENT_INSTRUCTION_VERSION:-none-v1}
      EMBEDDING_NORMALIZATION: ${EMBEDDING_NORMALIZATION:-none}
      EMBEDDING_PRECISION: ${EMBEDDING_PRECISION:-float32}
      MODEL_ALLOW_EXTERNAL: ${MODEL_ALLOW_EXTERNAL:-false}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-15}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.1}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-15}
      RETRIEVAL_DEBUG_DIAGNOSTICS: ${RETRIEVAL_DEBUG_DIAGNOSTICS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'worker' /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - path: ../apps
          action: sync
          target: /app/apps
        - path: ../packages
          action: sync
          target: /app/packages
    volumes:
      - blobdata:/app/data/blobs

  web:
    image: agent-knowledge-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  otel-collector:
    profiles:
      - otel
    image: otel/opentelemetry-collector-contrib:0.121.0@sha256:789689988e379c58ac12b07718dbcf4b23c2214bd804173c1c77af346d381c15
    ports:
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  tei:
    profiles:
      - embedding
    # GPU version: requires nvidia-container-toolkit on host + CUDA 12.2+ drivers
    # Pin digest after first pull: docker inspect --format='{{.RepoDigests}}' <image>
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    command:
      - --model-id
      - /data/model
      - --revision
      - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    ports:
      - "${EMBEDDING_PORT:-8080}:80"
    volumes:
      - teidata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  reranker:
    profiles:
      - reranker
    # GPU version: requires nvidia-container-toolkit on host + CUDA 12.2+ drivers
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    command:
      - --model-id
      - /data/model
      - --revision
      - 2cfc18c9415c912f9d8155881c133215df768a70
    ports:
      - "${RERANKER_PORT:-8081}:80"
    volumes:
      - rerankerdata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  blobdata:
  teidata:
  rerankerdata:
