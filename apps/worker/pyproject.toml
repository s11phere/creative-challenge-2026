[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "application",
    "infrastructure",
    "dramatiq",
    "model-gateway",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["worker*"]
